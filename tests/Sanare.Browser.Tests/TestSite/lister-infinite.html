<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Infinite Lister</title><style>#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{height:240px;border:1px solid #333}</style></head><body><main><h1>Lazy catalog</h1><section id="grid"></section><div id="sentinel">Scroll for more</div></main><script>const grid=document.querySelector('#grid');let count=0;function add(){for(let i=0;i<6;i++){count++;const card=document.createElement('article');card.className='card';card.textContent=`Lazy item ${count}`;grid.append(card);}}add();add();window.addEventListener('scroll',()=>{if(innerHeight+scrollY>=document.body.scrollHeight-10&&count<18)add();});</script></body></html>
