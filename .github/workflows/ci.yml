# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET local tools
        if: hashFiles('dotnet-tools.json', '.config/dotnet-tools.json') != ''
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format Sanare.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        # Category=Browser tests launch a real Chromium instance via Playwright, which is not installed
        # on this runner (see docs/features/browser-tier.md). They run in a dedicated job/step instead.
        run: dotnet test --no-build --no-restore --configuration Release --verbosity normal --report-gh -- --filter-not-trait "Category=Browser"

  # The single required check once the ruleset switches from `Build and Test (.NET)` to `ci`;
  # both contexts exist meanwhile so the rename never blocks a pull request.
  ci:
    name: ci
    needs: [build-and-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report CI result
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "CI checks failed"
            exit 1
          fi
          echo "All required CI checks passed."
